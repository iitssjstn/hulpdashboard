{# Gebruik: include met variabelen key, label, is_set, action #}
<div class="secret" data-key="{{ key }}">
  <div class="secret-head">
    <strong>{{ label }}</strong>
    {% if is_set %}<span class="pill pill-ok">ingesteld ✓</span>{% else %}<span class="pill pill-bad">niet ingesteld</span>{% endif %}
  </div>
  <form method="post" action="{{ action }}" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    {% if is_set %}
      <details>
        <summary>Vervangen</summary>
        <div class="stack">
          <input type="password" name="secret" autocomplete="off" spellcheck="false" placeholder="Plak hier de nieuwe waarde">
          <div class="row">
            <button type="button" class="js-test" data-key="{{ key }}">Test</button>
            <button class="primary" name="action" value="save">Opslaan</button>
          </div>
        </div>
      </details>
      <div class="row"><button type="button" class="js-test" data-key="{{ key }}" data-stored="1">Test huidige</button></div>
    {% else %}
      <input type="password" name="secret" autocomplete="off" spellcheck="false" placeholder="Plak hier de waarde">
      <div class="row">
        <button type="button" class="js-test" data-key="{{ key }}">Test</button>
        <button class="primary" name="action" value="save">Opslaan</button>
        {% if wizard %}<button name="action" value="skip" class="ghost" formnovalidate>Later invullen</button>{% endif %}
      </div>
    {% endif %}
    <div class="test-result" hidden></div>
  </form>
</div>
