<label>Server-ID <span class="muted">(rechtsklik op de server → ID kopiëren)</span>
  <input name="guild_id" inputmode="numeric" value="{{ s.guild_id }}" placeholder="bijv. 112233445566778899"></label>
<label>Kanaal-ID #hulp <span class="muted">(hier stelt je vader zijn vragen)</span>
  <input name="help_channel_id" inputmode="numeric" value="{{ s.help_channel_id }}" placeholder="leeg = kanaal met de naam #hulp"></label>
<label>Kanaal-ID #geheugen <span class="muted">(hier meldt de bot nieuwe feiten)</span>
  <input name="memory_channel_id" inputmode="numeric" value="{{ s.memory_channel_id }}" placeholder="leeg = kanaal met de naam #geheugen"></label>
<label>Jouw Discord user ID <span class="muted">(rechtsklik op je eigen naam → ID kopiëren)</span>
  <input name="owner_user_id" inputmode="numeric" value="{{ s.owner_user_id }}" placeholder="bijv. 998877665544332211"></label>
<label>Kanaal-ID meldingen voor jou <span class="muted">(hier tagt de bot je met een samenvatting)</span>
  <input name="owner_channel_id" inputmode="numeric" value="{{ s.owner_channel_id }}" placeholder="leeg = de bot maakt zelf een privékanaal #voor-jouw-naam"></label>
