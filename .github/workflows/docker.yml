name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

# Alleen de ingebouwde GITHUB_TOKEN; geen extra secrets of personal access tokens nodig.
permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Afhankelijkheden
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Imagenaam (lowercase) en korte SHA
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Tags bepalen
        id: tags
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          SHA: ${{ steps.vars.outputs.sha }}
        run: |
          tags="${IMAGE}:${SHA}"
          # 'latest' alleen vanaf main, zodat een handmatige run op een andere branch latest niet overschrijft.
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags="${tags},${IMAGE}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: QEMU (voor arm64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Inloggen bij GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bouwen en pushen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            GIT_SHA=${{ steps.vars.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=hulpdashboard
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Samenvatting
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          {
            echo "### Image gepubliceerd"
            echo ""
            echo "${TAGS}" | tr ',' '\n' | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
